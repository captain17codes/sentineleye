name: Supabase audit (live site end-to-end)
on:
  push:
    branches: [db-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://cwhubxdspsadszdtwhpz.supabase.co
      SUPABASE_KEY: sb_publishable_aT8Ph7IAz8mPRNKrg3PBBg_ngZViQyt
      OUT: ${{ github.workspace }}/database/audit_result.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright
        working-directory: tools/audit
        run: |
          npm init -y >/dev/null
          npm i playwright-core@1.48.2 >/dev/null
          google-chrome --version
      - name: Wait for the latest Vercel deploy
        run: sleep ${{ github.event.head_commit.message == 'audit now' && 1 || 150 }}
      - name: Run audit
        working-directory: tools/audit
        run: |
          : > $OUT
          node e2e_live.mjs > /tmp/e2e.log 2>&1 || echo "E2E FAILED (exit $?)" >> $OUT
          echo "----- raw log -----" >> $OUT; tail -c 6000 /tmp/e2e.log >> $OUT
          mkdir -p ../../database/audit_shots && cp shots/*.png ../../database/audit_shots/ 2>/dev/null || true
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/audit_result.txt database/audit_shots
          git commit -m "db audit result" && git push
